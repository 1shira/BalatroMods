[manifest]
version = "1.0.0"
dump_lua = true
priority = -10

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = 'if G.CONTROLLER.text_input_hook == e and G.CONTROLLER.HID.controller then'
position = "at"
payload = 'if G.CONTROLLER.text_input_hook == e and (G.CONTROLLER.HID.controller or G.CONTROLLER.HID.touch) then'
match_indent = true

[[patches]]
[patches.pattern]
target = "main.lua"
pattern = 'local os = love.system.getOS()'
position = "after"
payload = 'love.window.setMode(2, 1)'
match_indent = true

[[patches]]
[patches.pattern]
target = "globals.lua" 
pattern = '--loadstring("\105\102\32\108\111\118\101\46\115\121\115\116\101\109\46\103\101\116\79\83\40\41\32\61\61\32\39\105\79\83\39\32\111\114\32\108\111\118\101\46\115\121\115\116\101\109\46\103\101\116\79\83\40\41\32\61\61\32\39\65\110\100\114\111\105\100\39\32\116\104\101\110\10\32\32\108\111\118\101\46\101\118\101\110\116\46\113\117\105\116\40\41\10\101\110\100\10")()'
position = "at"
payload = '''
-- Removed 'loadstring' line which generated lua code that exited upon starting on mobile
if love.system.getOS() == 'Android' or love.system.getOS() == 'iOS' then
	self.F_SAVE_TIMER = 5
	self.F_DISCORD = true
	self.F_NO_ACHIEVEMENTS = true
	self.F_CRASH_REPORTS = false
	self.F_SOUND_THREAD = true
	self.F_VIDEO_SETTINGS = false
	self.F_ENGLISH_ONLY = false
	self.F_QUIT_BUTTON = false
	self.F_MOBILE_UI = true
end'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "highdpi = (love.system.getOS() == 'OS X')"
position = "at"
payload = "highdpi = (love.system.getOS() == 'OS X' or love.system.getOS() == 'Android' or love.system.getOS() == 'iOS')"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = 'resizable = true,'
position = "at"
payload = "resizable = not (love.system.getOS() == 'Android' or love.system.getOS() == 'iOS'),"
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "love.graphics.setShader( G.SHADERS['CRT'])"
position = "at"
payload = ''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "G.UIDEF = {}"
position = "after"
payload = """
local _, _, __balatromobile_fps_cap_p_wflags = love.window.getMode()
local __balatromobile_fps_cap_options = {
  labels = {"Monitor", 30, 60, 90, 120, 144, 240, "Max"},
  reverse_lookup  = {
    ["Monitor"] = 1,
    [30] = 2,
    [60] = 3,
    [90] = 4,
    [120] = 5,
    [144] = 6,
    [240] = 7,
    ["Max"] = 8,
  },
  values  = {
    ["Monitor"] = __balatromobile_fps_cap_p_wflags.refreshrate,
    [30] = 30,
    [60] = 60,
    [90] = 90,
    [120] = 120,
    [144] = 144,
    [240] = 240,
    ["Max"] = 500,
  },
}
G.FUNCS.__balatromobile_fps_cap_callback = function(option)
  G.SETTINGS.__balatromobile_FPS_CAP = option.to_val
  G.FPS_CAP = __balatromobile_fps_cap_options.values[option.to_val]
end
G.FPS_CAP = G.FUNCS.__balatromobile_fps_cap_callback {
  to_val = G.SETTINGS.__balatromobile_FPS_CAP or "Monitor"
}
"""
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "create_option_cycle({w = 4,scale = 0.8, label = localize(\"b_set_CRT_bloom\"),options = localize('ml_bloom_opt'), opt_callback = 'change_crt_bloom', current_option = G.SETTINGS.GRAPHICS.bloom}),"
position = "after"
payload = """
      {n = G.UIT.R, config = {align = "cm", r = 0}, nodes = {create_option_cycle{
        label = "FPS Limit",
        w = 4,
        scale = 0.8,
        options = __balatromobile_fps_cap_options.labels,
        opt_callback = '__balatromobile_fps_cap_callback',
        current_option =
         __balatromobile_fps_cap_options.reverse_lookup[G.SETTINGS.__balatromobile_FPS_CAP],
      }}},
"""
match_indent = true
